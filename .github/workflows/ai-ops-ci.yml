name: AI 운영 조사 로컬 검사

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      ai_changes: ${{ steps.scope.outputs.ai_changes }}
    steps:
      - id: scope
        run: echo 'ai_changes=true' >> "$GITHUB_OUTPUT"

  contracts:
    needs: scope
    if: needs.scope.outputs.ai_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 버전 6
      - name: 잠금된 데이터 계약 의존성 설치
        run: |
          python3 -m venv /tmp/ai-ops-venv
          /tmp/ai-ops-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ai-ops/requirements.lock
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # 버전 5.0.1
        with:
          version: v4.1.3
      - name: 계약·증거 처리·로컬 조사·fixture 검사
        run: |
          /tmp/ai-ops-venv/bin/python -m compileall -q ai-ops/src ai-ops/scripts ai-ops/tests
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m ai_ops --help
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m unittest discover -s ai-ops/tests -p 'test_*.py' -v
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_task_service_local.py
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_slack_adapter_local.py
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_runbook_search_local.py
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_runbook_context_local.py
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m ai_ops.workflow_config --config ai-ops/config/request-workflow.local.example.json
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_request_workflow_local.py
          /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_dev_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_v2_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_v3_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/export_schemas.py
          git diff --exit-code -- ai-ops/schemas
      - name: 실습과 같은 kubectl로 로컬 TLS·Lease proxy 검사
        run: |
          set -euo pipefail
          proxy_tools="$RUNNER_TEMP/c4-proxy-tools"
          mkdir -p "$proxy_tools"
          curl -fsSL -o "$proxy_tools/kubectl" https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl
          curl -fsSL -o "$proxy_tools/kubectl.sha256" https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$proxy_tools/kubectl.sha256")  $proxy_tools/kubectl" | sha256sum --check --status
          chmod +x "$proxy_tools/kubectl"
          PATH="$proxy_tools:$PATH" PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_c4_lease_proxy_local.py
      - name: 고정된 운영 chart 계약을 읽기 전용으로 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: f-lab-edu/F-Lab-DevOps
          ref: 9573b8c9f323a643e65bb58c323dc932c681a6b2
          path: .platform-source
          persist-credentials: false
          sparse-checkout: |
            url-shortener/url-shortener-chart
            cluster-addons/prometheus
      - name: 저장소 소유권·실행 경계 검사
        run: python3 ai-ops/scripts/check_repository_boundary.py
      - name: 배포 정의·읽기 권한·통신·저장 정적 검사
        env:
          AI_OPS_PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/.platform-source
        run: PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_deployment.py

  lease-trace:
    name: Lease trace local contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: ai-ops/tools/lease-trace-kubectl/go.sum
      - name: 잠금된 도구·모듈 준비
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/trace-venv"
          "$RUNNER_TEMP/trace-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ai-ops/requirements.lock
          (cd ai-ops/tools/lease-trace-kubectl && go mod download)
          git diff --exit-code -- ai-ops/tools/lease-trace-kubectl/go.mod ai-ops/tools/lease-trace-kubectl/go.sum
          mkdir -m 700 "$RUNNER_TEMP/trace-tools"
          curl -fsSL -o "$RUNNER_TEMP/trace-tools/kubectl" https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl
          curl -fsSL -o "$RUNNER_TEMP/trace-tools/kubectl.sha256" https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/trace-tools/kubectl.sha256")  $RUNNER_TEMP/trace-tools/kubectl" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/trace-tools/kubectl"
      - name: 오프라인 진단 빌드·인증 race 검사
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GONOPROXY: none
        run: |
          set -euo pipefail
          python3 ai-ops/tools/lease-trace-kubectl/build.py --offline --go "$(command -v go)" --output "$RUNNER_TEMP/trace-build"
          (cd "$RUNNER_TEMP/trace-build" && go test -mod=readonly -race k8s.io/client-go/plugin/pkg/client/auth/exec -count=1)
      - name: 가짜 인증·loopback 지연·Lease 계약 검증
        env:
          PYTHONPATH: ai-ops/src
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trace-tools:$PATH"
          trace_pin=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"trace-build/build-manifest.json").read_text())["binary_sha256"])')
          "$RUNNER_TEMP/trace-venv/bin/python" ai-ops/scripts/check_c4_lease_stages_local.py --binary "$RUNNER_TEMP/trace-build/kubectl-c04-trace" --sha256 "$trace_pin"
          "$RUNNER_TEMP/trace-venv/bin/python" ai-ops/scripts/check_c4_lease_proxy_local.py --trace-binary "$RUNNER_TEMP/trace-build/kubectl-c04-trace" --trace-sha256 "$trace_pin"

  image:
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 버전 6
      - name: 독립 에이전트 이미지 빌드
        run: docker build --tag ai-ops:ci ai-ops
      - name: 통신 없는 읽기 전용 이미지 실행 검사
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m ai-ops:ci --help
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python ai-ops:ci -c \
            'import os, pydantic; from ai_ops.replay_tools import _runbook; assert os.getuid() == 10001; assert pydantic.__version__ == "2.13.5"; [_runbook(name) for name in ("cache", "database", "deployment")]'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python ai-ops:ci -c \
            'from ai_ops.runbook_search import RunbookSearch; result=RunbookSearch().search("ImagePullBackOff",document_ids=["deployment"]); assert result["hits"][0]["section"]["start_line"] == 43; assert not result["execution_allowed"]'



  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.7
      - name: AI root 구성만 검사
        working-directory: terraform/ai-ops-registry
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate

  main-gate:
    name: C03 Main PR Gate
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: [scope, contracts, image, terraform, lease-trace]
    runs-on: ubuntu-24.04
    steps:
      - name: 적용 범위에 맞는 검사 결과 확인
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          AI_CHANGES: ${{ needs.scope.outputs.ai_changes }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          LEASE_TRACE_RESULT: ${{ needs.lease-trace.result }}
        run: |
          [[ "$SCOPE_RESULT" == success && "$LEASE_TRACE_RESULT" == success ]] || exit 1
          case "$AI_CHANGES" in
            true)
              [[ "$CONTRACTS_RESULT" == success && "$IMAGE_RESULT" == success && "$TERRAFORM_RESULT" == success ]]
              ;;
            false)
              [[ "$CONTRACTS_RESULT" == skipped && "$IMAGE_RESULT" == skipped ]]
              ;;
            *) exit 1 ;;
          esac
